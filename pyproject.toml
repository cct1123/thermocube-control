[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project]
name = "thermocube-control"
version = "0.2.0"
description = "Small synchronous ThermoCube R2 controller with optional monitoring and Dash UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
gui = ["dash>=4.4,<5"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.16,<0.17", "mypy>=2,<3", "types-pyserial"]

[project.scripts]
thermocube = "thermocube.gui:main"

[tool.uv.build-backend]
module-name = "thermocube"
source-include = [
    "uv.lock", ".python-version", "AGENTS.md", "ARCHITECTURE.md", 'prompt\ log.md',
    "docs/*.md", "examples/*.py", "tests/*.py", "tools/*.py",
    "records/candidate-manifest.json", "records/software-checks.json",
    "inputs/README.md", "inputs/*.pdf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/thermocube"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["dash.*"]
ignore_missing_imports = true
