name: Hardware-free checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra gui
      - run: uv run --locked ruff check src tests tools examples
      - run: uv run --locked ruff format --check src tests tools examples
      - run: uv run --locked mypy
      - run: uv run --locked --extra gui pytest -q --cov=thermocube --cov-fail-under=90
      - run: uv pip check
      - run: uv build
      - run: uv run --locked --extra gui python tools/verify_artifacts.py
